{
    "device_name": "__DEVICE_NAME__",
    "listening_port": __SYNC_PORT__,
    "storage_path": "/config/storage",
    "pid_file": "/config/storage/sync.pid",
    "vendor": "docker",
    "display_new_version": false,
    "use_upnp": false,
    "download_limit": 0,
    "upload_limit": 0,
    "directory_root_policy": "belowroot",
    "directory_root": "/",
    "files_default_path": "/downloads",
    "webui": {
        "listen": "0.0.0.0:__WEBUI_PORT__",
        "allow_empty_password": false,
        "dir_whitelist": [
            "/users",
            "/shared",
            "/other",
            "/downloads"
        ]
    }
}
