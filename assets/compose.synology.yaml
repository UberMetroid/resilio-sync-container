# Synology DSM 7.2+ Container Manager Project Compose File
# Before starting on Synology DSM, raise kernel inotify watches via Control Panel -> Task Scheduler (Triggered Task -> Boot-up as root):
#   sysctl -w fs.inotify.max_user_watches=524288
services:
  resilio-sync:
    image: ghcr.io/ubermetroid/resilio-sync-container:latest
    container_name: resilio-sync
    hostname: synology-resilio-sync
    restart: unless-stopped
    entrypoint: ["/bin/rslsync-init"]
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1026
      - PGID=100
      - UMASK=002
      - DEVICE_NAME=synology-resilio-sync
      - WEBUI_PORT=8888
      - SYNC_PORT=55555
      - HEALTH_PORT=9198
      - SEED_IGNORE_LIST=false
      - DROP_PRIVS=true
    ports:
      - "8888:8888/tcp"
      - "55555:55555/tcp"
      - "55555:55555/udp"
      - "127.0.0.1:9198:9198/tcp"
    volumes:
      - /volume1/docker/resilio-sync/config:/config:rw
      - /volume1/users:/users:rw
      - /volume1/shared:/shared:rw
      - /volume1/other:/other:rw
      - /volume1/downloads:/downloads:rw
    healthcheck:
      test: ["CMD", "/bin/rslsync-health", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
