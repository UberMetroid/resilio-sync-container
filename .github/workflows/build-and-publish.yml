name: Build & Publish Reproducible Guix / Nix Container

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  RSLSYNC_VERSION: "3.1.2.1076-1"
  RSLSYNC_DEB_SHA256: "31b623897fef0682b97f6274d124a7d7003c5d0db47f3fe3407a5c45258fbcbb"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Step 1 - Rust Gate & Unit Tests
        run: cargo test --workspace --all-targets

      - name: Step 2 - Strict Clippy Zero-Panic Gate
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic

      - name: Step 3 - Rust Formatting Check
        run: cargo fmt --all -- --check

      - name: Step 4 - Build Static Rust Supervision Binaries
        run: |
          RUSTFLAGS="-C target-feature=+crt-static -C relocation-model=static -C target-cpu=x86-64" cargo build --release --workspace --target x86_64-unknown-linux-musl
          mkdir -p prebuilt
          cp target/x86_64-unknown-linux-musl/release/rslsync-init prebuilt/
          cp target/x86_64-unknown-linux-musl/release/rslsync-config prebuilt/
          cp target/x86_64-unknown-linux-musl/release/rslsync-health prebuilt/
          chmod 755 prebuilt/rslsync-*

      - name: Step 5 - Fetch & Verify SHA256-Pinned Resilio Sync v3 DEB
        run: |
          DEB_URL="https://linux-packages.resilio.com/resilio-sync/deb/pool/non-free/r/resilio-sync/resilio-sync_${RSLSYNC_VERSION}_amd64.deb"
          curl -fsSL "$DEB_URL" -o /tmp/resilio-sync.deb
          echo "${RSLSYNC_DEB_SHA256}  /tmp/resilio-sync.deb" | sha256sum -c -
          mkdir -p /tmp/rslsync-extract
          cd /tmp/rslsync-extract
          ar x /tmp/resilio-sync.deb
          tar -xf data.tar.*
          cp usr/bin/rslsync "${GITHUB_WORKSPACE}/prebuilt/rslsync"
          chmod 755 "${GITHUB_WORKSPACE}/prebuilt/rslsync"

      - name: Step 6 - Pack Reproducible Container Image (Guix / Nix)
        run: |
          if ! command -v guix >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y guix patchelf || true
          fi
          if command -v guix >/dev/null 2>&1; then
            PACK_PATH=$(guix pack -f docker --entry-point=/bin/rslsync-init -S /bin=bin -S /etc=etc -S /share=share -m manifest.scm | tail -n 1)
            cp "$PACK_PATH" resilio-sync-guix-docker-x86_64.tar.gz
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 7 - Load Image, Smoke-Test & Push Updated Digest to GHCR
        run: |
          if [ -f resilio-sync-guix-docker-x86_64.tar.gz ]; then
            IMAGE_NAME=$(docker load -i resilio-sync-guix-docker-x86_64.tar.gz | awk -F': ' '/Loaded image:/ {print $2}')
            CONTAINER_ID=$(docker create "$IMAGE_NAME" /bin/rslsync-init)
            docker cp prebuilt/rslsync-init "$CONTAINER_ID":/bin/rslsync-init
            docker cp prebuilt/rslsync-config "$CONTAINER_ID":/bin/rslsync-config
            docker cp prebuilt/rslsync-health "$CONTAINER_ID":/bin/rslsync-health
            docker commit \
              --change 'LABEL org.opencontainers.image.source="https://github.com/UberMetroid/resilio-sync-container"' \
              --change 'ENTRYPOINT ["/bin/rslsync-init"]' \
              --change 'HEALTHCHECK --interval=30s --timeout=5s --retries=3 CMD ["/bin/rslsync-health", "--check"]' \
              "$CONTAINER_ID" ghcr.io/ubermetroid/resilio-sync-container:latest
            docker rm -f "$CONTAINER_ID"
          else
            cat << 'EOF' > /tmp/Dockerfile.ci
          FROM debian:bookworm-slim
          LABEL org.opencontainers.image.source="https://github.com/UberMetroid/resilio-sync-container"
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates util-linux procps libcrypt1 && rm -rf /var/lib/apt/lists/* \
              && (grep -q ':1000:' /etc/group || echo 'fedora:x:1000:' >> /etc/group) \
              && (grep -q ':1000:1000:' /etc/passwd || echo 'fedora:x:1000:1000:Fedora User:/config:/bin/sh' >> /etc/passwd) \
              && (grep -q ':1026:' /etc/passwd || echo 'rslsync:x:1026:100:Synology User:/config:/bin/sh' >> /etc/passwd) \
              && (grep -q ':99:100:' /etc/passwd || sed -i 's/^nobody:x:65534:65534:/nobody:x:99:100:/' /etc/passwd)
          COPY prebuilt/rslsync-init /bin/rslsync-init
          COPY prebuilt/rslsync-config /bin/rslsync-config
          COPY prebuilt/rslsync-health /bin/rslsync-health
          COPY prebuilt/rslsync /bin/rslsync
          COPY assets/default-sync.conf /etc/resilio-sync/default-sync.conf
          COPY assets/default-IgnoreList /etc/resilio-sync/default-IgnoreList
          ENTRYPOINT ["/bin/rslsync-init"]
          HEALTHCHECK --interval=30s --timeout=5s --retries=3 CMD ["/bin/rslsync-health", "--check"]
          EOF
            docker build -f /tmp/Dockerfile.ci -t ghcr.io/ubermetroid/resilio-sync-container:latest .
          fi
          docker run -d --name rslsync-smoke -e PUID=1026 -e PGID=100 ghcr.io/ubermetroid/resilio-sync-container:latest
          for i in $(seq 1 20); do
            sleep 2
            if docker exec rslsync-smoke /bin/rslsync-health --check; then
              break
            fi
          done
          docker logs rslsync-smoke
          docker exec rslsync-smoke /bin/rslsync-health --check
          docker rm -fv rslsync-smoke
          docker tag ghcr.io/ubermetroid/resilio-sync-container:latest ghcr.io/ubermetroid/resilio-sync-container:v0.3.2
          docker push ghcr.io/ubermetroid/resilio-sync-container:latest
          docker push ghcr.io/ubermetroid/resilio-sync-container:v0.3.2

